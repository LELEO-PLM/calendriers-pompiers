<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendriers">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4FA3">
<title>Calendriers Puiselet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout : app mobile une colonne — accueil (secteurs) puis liste des maisons d'un secteur, fiche passage en tiroir bas */
:root{
  --bg:#F2F1EE; --surface:#FFFFFF; --ink:#1B1A19; --muted:#6B6762; --line:#E2DFDA;
  --red:#1E4FA3; --red-ink:#FFFFFF; --gold:#1E4FA3; --gold-soft:#E4ECF8; --flag:#E1000F;
  --ok:#1F7A3E; --ok-soft:#E3F2E7; --warn:#A35F00; --warn-soft:#FCEFD9; --no:#5E5A55; --no-soft:#ECEAE6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312; --surface:#1F1D1B; --ink:#F2EFEA; --muted:#A39E97; --line:#34312D;
  --red:#3D6FC4; --red-ink:#FFFFFF; --gold:#5B8BDB; --gold-soft:#1C2A42; --flag:#F0373F;
  --ok:#5CC17D; --ok-soft:#1B3324; --warn:#F0A94A; --warn-soft:#3A2A12; --no:#B7B1A9; --no-soft:#2C2A27;
  color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}

/* En-tête */
.masthead{background:var(--red);color:var(--red-ink);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 18px;position:relative;overflow:hidden}
.masthead::after,.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#1E4FA3 0 33.3%,#FFFFFF 33.3% 66.6%,var(--flag) 66.6%)}
.mh-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mh-in img.blason{height:58px;background:#fff;border-radius:10px;padding:4px;width:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.mh-in img.sdis{height:52px;width:52px;border-radius:10px;background:#fff;padding:3px;margin-left:auto}
.mh-title{min-width:0}
.mh-title small{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.mh-title h1{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1;margin:2px 0 0;letter-spacing:.01em}

.hello{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 4px;color:var(--muted);font-size:.95rem}
.linkbtn{background:none;border:0;color:var(--red);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* Bilan global */
.total{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:12px 0 20px}
.total div{background:var(--surface);padding:14px 16px}
.total div:first-child b{color:var(--red)}
.total b{display:block;font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.total span{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

h2.sec{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}

/* Secteurs */
.sectors{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.sector{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sector:active{transform:scale(.99)}
.sector .nm{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.1}
.sector .eur{font-family:var(--display);font-weight:600;font-size:1.2rem;font-variant-numeric:tabular-nums;text-align:right}
.sector .meta{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--no-soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-warn{background:var(--warn)} .bar .b-no{background:var(--no)}

/* Vue secteur */
.topbar{position:sticky;overflow:hidden;top:0;z-index:5;background:var(--red);color:var(--red-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 16px}
.topbar .in{max-width:640px;margin:0 auto}
.tb-row{display:flex;align-items:center;gap:10px}
.back{background:rgba(255,255,255,.16);border:0;color:inherit;border-radius:10px;width:44px;height:44px;font-size:1.4rem;line-height:1;flex:none}
.tb-row h1{font-family:var(--display);font-size:1.45rem;margin:0;line-height:1.05;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-stats{font-size:.88rem;opacity:.92;font-variant-numeric:tabular-nums;margin-top:2px}
.tools{display:flex;flex-direction:column;gap:10px;margin:14px 0 6px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 11px;font-weight:600;font-size:.88rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}

.street{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.98rem;color:var(--gold);margin:20px 0 6px;display:flex;justify-content:space-between;gap:8px}
.street span{color:var(--muted);font-weight:600}
.houses{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.house{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:64px}
.house .num{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1;text-align:center;border-right:1px solid var(--line);padding-right:10px;overflow-wrap:anywhere}
.house .num.empty .n{color:var(--muted);font-size:1rem}
.house .num .n{display:block}
.house .num .voie{display:block;font-family:var(--body);font-weight:600;font-size:.62rem;line-height:1.15;color:var(--red);text-transform:uppercase;letter-spacing:.02em;margin-top:4px;overflow-wrap:anywhere}
.house .who{min-width:0}
.house .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.house .who b.anon{color:var(--muted);font-weight:500;font-style:italic}
.house .sub{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.82rem;color:var(--muted);margin-top:2px}
.tag{background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:1px 6px;font-weight:600}
.pill{font-size:.82rem;font-weight:700;border-radius:99px;padding:6px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.todo{border:1.5px dashed var(--line);color:var(--muted);font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--no-soft);color:var(--no)}
.house.s-ok{border-left:5px solid var(--ok)} .house.s-warn{border-left:5px solid var(--warn)} .house.s-no{border-left:5px solid var(--no)}
.pending{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.team{grid-column:1/-1;justify-self:start;font-size:.8rem;font-weight:600;color:var(--red);background:var(--gold-soft);border-radius:6px;padding:2px 8px}
.team.free{color:var(--muted);background:var(--no-soft)}
.claim{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--gold-soft);border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:500}
.primary.small{padding:10px 14px;font-size:.95rem;flex:none}
.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.8rem;line-height:1.5}
.foot p{margin:6px auto 0;max-width:40ch}
.field.code{font-size:1.6rem;letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums}
.err{color:var(--flag);font-weight:600;margin:8px 0 0}
.hello{gap:10px}
.respbtn{flex:none;border:1.5px solid var(--red);color:var(--red);background:transparent;border-radius:99px;padding:7px 14px;font-weight:700;font-size:.88rem}
.respbtn.on{background:var(--red);color:var(--red-ink)}
.adm{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.adm .sec{margin:8px 0 0}
.total.four{grid-template-columns:1fr 1fr;margin:0}
.total.four b{font-size:1.5rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .nm{font-family:var(--display);font-size:1.2rem;min-width:0;overflow-wrap:anywhere}
.card .eur{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums;flex:none}
.card .meta{font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card select.field{padding:10px 12px;font-size:1rem}
.hint{font-size:.88rem;color:var(--muted);margin:2px 0}
.danger{background:transparent;border:1px solid var(--flag);color:var(--flag);border-radius:12px;padding:13px;font-weight:600}
.danger.armed{background:var(--flag);color:#fff}
.empty-state{text-align:center;color:var(--muted);padding:36px 12px}
.add{margin-top:20px;width:100%;border:2px dashed var(--line);background:transparent;border-radius:12px;padding:14px;font-weight:600;color:var(--muted)}

/* Tiroir */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .2s ease-out}
.sheet.on{transform:none}
.sheet .in{max-width:640px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh-addr{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.05;margin:0}
.sh-who{color:var(--muted);margin:4px 0 0}
.info{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.info .tag{font-weight:500}
.last{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.lbl{display:block;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-weight:700;font-size:1rem;min-height:52px}
.seg button[aria-pressed="true"].v-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"].v-warn{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button[aria-pressed="true"].v-no{background:var(--no);border-color:var(--no);color:var(--surface)}
.amounts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.amounts button{min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 0;font-weight:700;font-variant-numeric:tabular-nums}
.amounts button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;font-size:1.05rem}
.money{position:relative}
.money input{padding-right:34px;font-variant-numeric:tabular-nums}
.money::after{content:"€";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay button{border:1px solid var(--line);background:var(--bg);border-radius:10px;font-weight:600;padding:12px 4px;min-height:48px}
.pay button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea.field{min-height:64px;resize:vertical;font-size:1rem}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.primary{background:var(--red);color:var(--red-ink);border:0;border-radius:12px;padding:15px;font-weight:700;font-size:1.08rem}
.primary:disabled{opacity:.45}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:600;color:var(--muted)}

/* Bandeau de synchro */
.sync{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 16px;font-size:.88rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.sync.err{background:var(--warn);color:#fff}

/* Écran prénom */
.welcome{padding:28px 0 0}
.welcome p{color:var(--muted);line-height:1.5;max-width:46ch}
.welcome h2{font-family:var(--display);font-size:1.6rem;margin:0 0 6px}
.loading{padding:48px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
</style>
</head>

function enqueue(p){
  S.queue=S.queue.filter(function(x){return !(x.id===p.id&&(x.kind||'')===(p.kind||''))});S.queue.push(p);ls(KEY_Q,S.queue);
  var r=S.byId[p.id];if(r){if(p.kind==='nom')Object.assign(r,{nom:p.nom,_pending:true});else Object.assign(r,{statut:p.statut,montant:p.montant,paiement:p.paiement,note:p.note,pompier:p.pompier,_pending:true})}
  flush();
}
function flush(){
  if(S.flushing||!S.queue.length||!S.code){showSync();return}
  S.flushing=true;showSync();
  var p=S.queue[0];
  api(p.kind==='nom'?'setNom':'savePassage',p).then(function(saved){
    S.queue=S.queue.filter(function(x){return !(x.id===p.id&&x.ts===p.ts&&(x.kind||'')===(p.kind||''))});ls(KEY_Q,S.queue);
    var r=S.byId[saved.id];
    if(r){if(!S.queue.some(function(x){return x.id===saved.id})){Object.assign(r,saved);delete r._pending}else if(p.kind==='nom'){r.nom=saved.nom}}
    S.lastErr='';S.flushing=false;render();flush();
  }).catch(function(e){
    S.flushing=false;S.lastErr=e;
    if(isCodeErr(e)){lockOut('Le code a changé. Demande le nouveau code à Jules FEVRE. Tes passages non envoyés sont gardés.');return}
    if(/introuvable|invalide|inconnu/i.test(e)){S.queue.shift();ls(KEY_Q,S.queue);toast('Non enregistré : '+e,true);render();return}
    showSync();setTimeout(flush,15000);
  });
}

    var bar=el('div',{class:'bar','aria-hidden':'true'},[
      el('i',{class:'b-ok',style:'width:'+(st.ok/st.n*100)+'%'}),
      el('i',{class:'b-no',style:'width:'+(st.no/st.n*100)+'%'}),
      el('i',{class:'b-warn',style:'width:'+(st.warn/st.n*100)+'%'})]);
    ul.appendChild(el('li',{},[el('button',{class:'sector',onclick:function(){openSector(s.name)}},[
      el('span',{class:'nm',text:s.name}),el('span',{class:'eur',text:eur(st.eur)}),
      el('span',{class:'meta',text:(st.ok+st.no)+' / '+st.n+' faites'+(st.warn?' · '+st.warn+' absent'+(st.warn>1?'s':''):'')}),
      el('span',{class:'meta',style:'text-align:right',text:st.todo?st.todo+' à faire':'Terminé'}),bar,
      el('span',{class:'team'+(eq?'':' free'),text:eq?(eq===S.name?'Votre équipe':'Équipe '+eq):'Libre'})])]));
  });
  return ul;
}

function claim(team){
  var sec=S.sector;S.equipes[sec]=team;render();
  api('setEquipe',{secteur:sec,equipe:team}).then(function(e){S.equipes=e;ls(KEY_EQ,e);render();toast(team?'Secteur pris par votre équipe':'Secteur libéré')}).catch(function(e){if(isCodeErr(e))return lockOut('Le code a changé. Demande le nouveau code à Jules FEVRE.');toast('Pas de réseau, réessaie : '+e,true);load()});
}
function openSector(name){S.view='sector';S.sector=name;S.q='';S.filter='todo';render();window.scrollTo(0,0)}
document.getElementById('back').addEventListener('click',function(){S.view='home';render();window.scrollTo(0,0)});

function cls(st){return st==='Donné'?'ok':st==='Absent'?'warn':st==='Refus'?'no':'todo'}
function pillText(r){if(r.statut==='Donné')return r.montant!==''&&r.montant!=null?eur(Number(r.montant)):'Donné';return r.statut||'À faire'}
function val2025(v){if(!v)return'';return /^[\d.,+ ]+$/.test(v)?v.replace(/\./g,',')+' €':v}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}

function renderSector(app){
  var rows=sectors().filter(function(s){return s.name===S.sector})[0];rows=rows?rows.rows:[];
  var st=stats(rows);
  document.getElementById('secName').textContent=S.sector;
  document.getElementById('secStats').textContent=eur(st.eur)+' · '+(st.ok+st.no)+' / '+st.n+' faites · '+st.todo+' à faire';
  var focused=document.activeElement&&document.activeElement.id==='search';
  app.innerHTML='';
  var search=el('input',{class:'search',id:'search',type:'search',placeholder:'Chercher un nom, un numéro, une rue…',value:S.q});
  search.addEventListener('input',function(){S.q=search.value;drawList()});
  var F=[['todo','À faire',st.todo],['warn','Absents',st.warn],['done','Faites',st.ok+st.no],['all','Toutes',st.n]];
  var chips=el('div',{class:'chips',role:'group','aria-label':'Filtrer'});
  F.forEach(function(f){chips.appendChild(el('button',{class:'chip','aria-pressed':String(S.filter===f[0]),onclick:function(){S.filter=f[0];render()}},[f[1],el('span',{class:'n',text:String(f[2])})]))});
  var eq=S.equipes[S.sector]||'';
  if(eq!==S.name){app.appendChild(el('div',{class:'claim'},[
    el('span',{text:eq?'Ce secteur est pris par l’équipe '+eq+'.':'Ce secteur est libre.'}),
    el('button',{class:'primary small',text:eq?'On le reprend':'On le prend',onclick:function(){claim(S.name)}})]))}
  app.appendChild(el('div',{class:'tools'},[search,chips]));
  var list=el('div',{id:'list'});app.appendChild(list);
  app.appendChild(el('button',{class:'add',text:'+ Ajouter une adresse qui manque',onclick:openAdd}));
  if(eq===S.name)app.appendChild(el('button',{class:'linkbtn',style:'display:block;margin:14px auto 0',text:'Libérer ce secteur',onclick:function(){claim('')}}));
  if(focused){search.focus();var v=search.value;search.value='';search.value=v}
  function drawList(){
    list.innerHTML='';
    var q=norm(S.q).trim();
    var shown=rows.filter(function(r){
      var c=cls(r.statut);
      if(S.filter==='todo'&&c!=='todo')return false;
      if(S.filter==='warn'&&c!=='warn')return false;
      if(S.filter==='done'&&!(c==='ok'||c==='no'))return false;
      if(q&&norm(r.nom+' '+r.numero+' '+r.rue+' '+r.quartier+' '+r.remarque).indexOf(q)<0)return false;
      return true});
    if(!shown.length){list.appendChild(el('div',{class:'empty-state',text:S.filter==='todo'&&!q?'Tout le secteur est fait. Bravo !':'Aucune maison ne correspond.'}));return}
    var groups=[],gi={};
    shown.forEach(function(r){var g=[r.quartier,r.rue].filter(Boolean).join(' · ')||'Sans rue indiquée';if(!(g in gi)){gi[g]=groups.length;groups.push({g:g,rows:[]})}groups[gi[g]].rows.push(r)});
    groups.forEach(function(G){
      list.appendChild(el('h3',{class:'street'},[G.g,el('span',{text:String(G.rows.length)})]));
      var ul=el('ul',{class:'houses'});
      G.rows.forEach(function(r){
        var c=cls(r.statut);
        var sub=[];
        if(r.remarque)sub.push(el('span',{class:'tag',text:r.remarque}));
        if(r.a2025)sub.push(el('span',{text:'2025 : '+val2025(r.a2025)}));
        if(r.statut&&r.pompier)sub.push(el('span',{text:r.pompier+(r.date?' · '+r.date:'')}));
        if(r.note)sub.push(el('span',{text:'« '+r.note+' »'}));
        ul.appendChild(el('li',{},[el('button',{class:'house s-'+c,onclick:function(){openSheet(r.id)}},[
          el('span',{class:'num'+(r.numero?'':' empty')},[el('span',{class:'n',text:r.numero||'—'}),r.rue?el('small',{class:'voie',text:r.rue}):null]),
          el('span',{class:'who'},[r.nom?el('b',{text:r.nom}):null,sub.length?el('span',{class:'sub'},sub):null]),
          el('span',{class:'pill '+c},[pillText(r),r._pending?el('i',{class:'pending',title:'En cours d’envoi'}):null])
        ])]));
      });
      list.appendChild(ul);
    });
  }
  drawList();
}

/* ---------- Tiroir ---------- */
var lastFocus=null;
function showSheet(build){
  lastFocus=document.activeElement;
  var sh=document.getElementById('sheet'),sc=document.getElementById('scrim'),inn=document.getElementById('sheetIn');
  inn.innerHTML='';inn.appendChild(el('div',{class:'grab'}));build(inn);
  sh.hidden=false;sc.hidden=false;requestAnimationFrame(function(){sh.classList.add('on');sc.classList.add('on')});
}
function closeSheet(){
  var sh=document.getElementById('sheet'),sc=document.getElementById('scrim');
  sh.classList.remove('on');sc.classList.remove('on');setTimeout(function(){sh.hidden=true;sc.hidden=true},200);
  if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}
}
document.getElementById('scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('sheet').hidden)closeSheet()});

function openSheet(id){
  var r=S.byId[id];if(!r)return;
  var f={statut:r.statut||'',montant:r.montant===''||r.montant==null?'':String(r.montant),paiement:r.paiement||'Espèces',note:r.note||''};
  showSheet(function(inn){
    var addr=[r.numero,r.rue].filter(Boolean).join(' ')||r.quartier||r.secteur;
    inn.appendChild(el('h2',{class:'sh-addr',id:'shAddr',text:addr}));
    if(r.quartier)inn.appendChild(el('p',{class:'sh-who',text:r.quartier}));
    var info=[];
    if(r.remarque)info.push(el('span',{class:'tag',text:r.remarque}));
    if(r.a2025)info.push(el('span',{class:'tag',text:'2025 : '+val2025(r.a2025)}));
    if(info.length)inn.appendChild(el('div',{class:'info'},info));
    if(r.statut&&r.pompier)inn.appendChild(el('p',{class:'last',text:'Déjà noté par '+r.pompier+(r.date?' le '+r.date:'')}));
    if(S.admin&&r.statut&&r.pompier)inn.appendChild(el('p',{class:'last',text:'Mode responsable : ta correction reste au nom de l’équipe '+r.pompier+'.'}));

    inn.appendChild(el('label',{class:'lbl',for:'hNom',text:'Nom et prénom des habitants'}));
    var hn=el('input',{class:'field',id:'hNom',maxlength:'80',autocomplete:'off',autocapitalize:'words',placeholder:'Ex. DUPONT Marie (complète si tu le vois)'});hn.value=r.nom||'';
    hn.addEventListener('input',function(){sync(true)});
    inn.appendChild(hn);
    inn.appendChild(el('p',{class:'hint',text:'Lu sur la boîte aux lettres ou donné par les habitants : ça sert de base pour l’an prochain.'}));
    function nomChanged(){return hn.value.trim().replace(/\s+/g,' ')!==(r.nom||'')}

    inn.appendChild(el('span',{class:'lbl',text:'Résultat'}));
    var seg=el('div',{class:'seg',role:'group','aria-label':'Résultat du passage'});
    [['Donné','v-ok'],['Absent','v-warn'],['Refus','v-no']].forEach(function(o){
      seg.appendChild(el('button',{class:o[1],'aria-pressed':String(f.statut===o[0]),text:o[0],onclick:function(){f.statut=o[0];sync()}}));
    });
    inn.appendChild(seg);

    var money=el('div',{});
    money.appendChild(el('span',{class:'lbl',text:'Montant'}));
    var am=el('div',{class:'amounts'});
    [5,10,15,20,30,50].forEach(function(v){am.appendChild(el('button',{'data-v':String(v),'aria-pressed':String(f.montant===String(v)),text:v+' €',onclick:function(){f.montant=String(v);mi.value=v;sync()}}))});
    money.appendChild(am);
    var mi=el('input',{class:'field',id:'montant',type:'number',inputmode:'decimal',min:'0',step:'0.5',placeholder:'Autre montant',value:f.montant,'aria-label':'Montant en euros'});
    mi.addEventListener('input',function(){f.montant=mi.value;sync(true)});
    var pay=el('div',{class:'pay',role:'group','aria-label':'Moyen de paiement'});
    ['Espèces','Chèque','CB'].forEach(function(p){pay.appendChild(el('button',{'aria-pressed':String(f.paiement===p),text:p,onclick:function(){f.paiement=p;sync()}}))});
    money.appendChild(el('div',{class:'money',style:'margin-top:8px'},[mi]));
    money.appendChild(el('span',{class:'lbl',text:'Paiement'}));
    money.appendChild(pay);
    inn.appendChild(money);

    inn.appendChild(el('label',{class:'lbl',for:'note',text:'Note (facultatif)'}));
    var note=el('textarea',{class:'field',id:'note',placeholder:'Ex. repasser le samedi, chien, boîte aux lettres…',maxlength:'300'});note.value=f.note;
    note.addEventListener('input',function(){f.note=note.value});
    inn.appendChild(note);

    var save=el('button',{class:'primary',text:'Enregistrer',onclick:function(){
      if(!f.statut&&!nomChanged())return;
      var nc=nomChanged();
      if(nc)enqueue({kind:'nom',id:r.id,nom:hn.value.trim().replace(/\s+/g,' '),pompier:S.name,ts:Date.now()});
      if(!f.statut||(f.statut===r.statut&&!S.admin&&String(f.montant)===String(r.montant===''||r.montant==null?'':r.montant)&&f.paiement===(r.paiement||'Espèces')&&f.note.trim()===(r.note||''))){closeSheet();render();toast('Nom enregistré');return}
      enqueue({id:r.id,statut:f.statut,montant:f.statut==='Donné'&&f.montant!==''?Number(String(f.montant).replace(',','.')):'',paiement:f.statut==='Donné'?f.paiement:'',note:f.note.trim(),pompier:S.name,keepTeam:!!S.admin,ts:Date.now()});
      closeSheet();render();toast(f.statut==='Donné'?'Enregistré : '+(f.montant?eur(Number(String(f.montant).replace(',','.'))):'calendrier donné'):'Enregistré : '+f.statut.toLowerCase());
    }});
    var acts=el('div',{class:'actions'},[save]);
    if(r.statut)acts.appendChild(el('button',{class:'ghost',text:'Remettre « à faire »',onclick:function(){
      enqueue({id:r.id,statut:'',montant:'',paiement:'',note:f.note.trim(),pompier:S.name,ts:Date.now()});closeSheet();render();toast('Remis à faire')}}));
    if(S.admin)acts.appendChild(el('button',{class:'ghost',text:'Modifier ou supprimer l’adresse',onclick:function(){openEditAddr(r)}}));
    acts.appendChild(el('button',{class:'ghost',text:'Fermer',onclick:closeSheet}));
    inn.appendChild(acts);

    function sync(fromInput){
      seg.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.textContent===f.statut))});
      money.hidden=f.statut!=='Donné';
      am.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===String(f.montant)))});
      pay.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.textContent===f.paiement))});
      save.disabled=!(f.statut||nomChanged());
      if(!fromInput&&f.statut==='Donné'&&!f.montant)setTimeout(function(){},0);
    }
    sync();
  });
}

function openAdd(){
  showSheet(function(inn){
    inn.appendChild(el('h2',{class:'sh-addr',id:'shAddr',text:'Nouvelle adresse'}));
    inn.appendChild(el('p',{class:'sh-who',text:S.sector}));
    var rues=[],seen={};S.rows.forEach(function(r){if(r.secteur===S.sector&&r.rue&&!seen[r.rue]){seen[r.rue]=1;rues.push(r.rue)}});
    var dl=el('datalist',{id:'rues'});rues.forEach(function(x){dl.appendChild(el('option',{value:x}))});
    var num=el('input',{class:'field',id:'aNum',placeholder:'Ex. 12 bis'});
    var rue=el('input',{class:'field',id:'aRue',list:'rues',placeholder:'Choisir ou taper la rue'});
    var nom=el('input',{class:'field',id:'aNom',placeholder:'Nom sur la boîte aux lettres'});
    inn.appendChild(dl);
    inn.appendChild(el('label',{class:'lbl',for:'aNum',text:'Numéro'}));inn.appendChild(num);
    inn.appendChild(el('label',{class:'lbl',for:'aRue',text:'Rue'}));inn.appendChild(rue);
    inn.appendChild(el('label',{class:'lbl',for:'aNom',text:'Nom (facultatif)'}));inn.appendChild(nom);
    var btn=el('button',{class:'primary',text:'Ajouter',onclick:function(){
      if(!num.value.trim()&&!rue.value.trim()&&!nom.value.trim()){num.focus();return}
      btn.disabled=true;btn.textContent='Ajout…';
      api('addAdresse',{secteur:S.sector,numero:num.value.trim(),rue:rue.value.trim(),nom:nom.value.trim(),pompier:S.name}).then(function(row){
        S.rows.push(row);S.byId[row.id]=row;closeSheet();S.filter='todo';render();toast('Adresse ajoutée');
      }).catch(function(e){if(isCodeErr(e))return lockOut('Le code a changé. Demande le nouveau code à Jules FEVRE.');btn.disabled=false;btn.textContent='Ajouter';toast('Ajout impossible : '+e,true)});
    }});
    inn.appendChild(el('div',{class:'actions'},[btn,el('button',{class:'ghost',text:'Annuler',onclick:closeSheet})]));
    setTimeout(function(){num.focus()},220);
  });
}

/* ---------- Démarrage ---------- */
S.name=ls(KEY_NAME)||'';
S.queue=ls(KEY_Q)||[];
S.admin=ls(KEY_ADMIN)||'';S.code=ls(KEY_CODE)||'';S.equipes=ls(KEY_EQ)||{};var cache=S.code?ls(KEY_CACHE):null;if(cache&&cache.length){setRows(cache)}
render();
load().then(flush);
setInterval(function(){if(S.code&&document.visibilityState==='visible'&&document.getElementById('sheet').hidden&&!S.flushing)load()},45000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){load();flush()}});
window.addEventListener('online',flush);
})();
</script>
</body>
</html>
